# -----------------------------------------------------------------------------
# Follope — Production Nginx Configuration
# Domains: follope.com, api.follope.com, follope.in
# -----------------------------------------------------------------------------

# Gzip Compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

# 1. HTTP -> HTTPS Redirection for all domains
server {
    listen 80;
    listen [::]:80;
    server_name follope.com www.follope.com api.follope.com follope.in www.follope.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Redirect follope.in to follope.com (SEO and branding consolidation)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name follope.in www.follope.in www.follope.com;

    ssl_certificate /etc/letsencrypt/live/follope.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/follope.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://follope.com$request_uri;
}

# 3. API Subdomain — api.follope.com -> Express Backend (:3000)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.follope.com;

    ssl_certificate /etc/letsencrypt/live/follope.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/follope.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy to Node.js / Docker backend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}

# 4. Main Web App & Public Invoice Viewer — follope.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name follope.com;

    root /var/www/follope/mobile/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/follope.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/follope.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Single Page App routing (renders /invoice/:token seamlessly)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static bundled assets
    location ~* \.(?:css|js|woff2?|svg|gif|png|jpg|jpeg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}
